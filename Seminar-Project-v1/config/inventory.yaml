balance_definition: "คงเหลือจากทุกรายการที่บันทึก = opening + receipt - issue แยกสินค้าและคลัง; แสดงคู่สินค้า/คลังที่ไม่มีรายการเป็น 0; ไม่กรองสถานะการชำระเงินและไม่ใช่ยอด ณ วันที่ย้อนหลัง"
issue_definition: "ยอดจ่ายออก = SUM(qty) เฉพาะ movement_type = issue ตาม movement_date ในเดือนที่ถาม รวมทุกคลัง; รวมทั้งรายการที่เกี่ยวและไม่เกี่ยวกับการขาย ไม่กรอง paid; สินค้าไม่มีรายการจ่ายแสดง 0"
