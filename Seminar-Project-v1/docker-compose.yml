
services:
  postgres_db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: seminar_admin
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:-local-admin-only}
      POSTGRES_DB: seminar_demo
      DEMO_READER_PASSWORD: ${DEMO_READER_PASSWORD:-local-reader-only}
      TZ: Asia/Bangkok
    volumes:
      - demo_pgdata_v2:/var/lib/postgresql/data
      - ./db:/project-db:ro
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/001-project-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seminar_admin -d seminar_demo"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://seminar_reader:${DEMO_READER_PASSWORD:-local-reader-only}@postgres_db:5432/seminar_demo
      PGTZ: Asia/Bangkok
      LLM_PROVIDER: ${LLM_PROVIDER:-kku-intelsphere}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://gen.ai.kku.ac.th/api/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.6-luna}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2048}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
    ports:
      - "${DEMO_HTTP_PORT:-8000}:8000"
    depends_on:
      postgres_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/wms/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  demo_pgdata_v2:
