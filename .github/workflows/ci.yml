name: project-verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: seminar_admin
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: seminar_tests
          TZ: Asia/Bangkok
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seminar_admin -d seminar_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: "host=127.0.0.1 port=5432 dbname=seminar_tests user=seminar_admin password=ci-test-only connect_timeout=5 options='-c timezone=Asia/Bangkok'"
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: Seminar-Project-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Seminar-Project-v1/requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Verify project without live LLM calls
        run: python -m scripts.verify_project
